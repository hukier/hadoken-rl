[project]
name = "hadoken-rl"
version = "0.1.0"
description = "Deep Reinforcement Learning agent for Street Fighter II using Stable-Retro, Gymnasium, and PPO."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.4.0",
    "stable-baselines3>=2.9.2",
    "stable-retro>=1.0.1; sys_platform == 'linux'",  # sin wheels para Windows: usar WSL2
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hadoken_rl"]
